# Development policy; Rivet does not read this file at runtime.
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
ignore = []

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "NCSA",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# cap-std 4.0.3 uses io-lifetimes 3 directly and io-lifetimes 2 through
# fs-set-times 0.20.3. Both upstream packages are current.
# tracing-attributes 0.1.31 still uses syn 2 while the current macro/schema
# dependency graph uses syn 3. Both upstream branches are current.
skip = [
    { crate = "io-lifetimes@2.0.4", reason = "cap-std 4.0.3 reaches io-lifetimes 2 through current fs-set-times 0.20.3" },
    { crate = "syn@2.0.119", reason = "current tracing-attributes 0.1.31 still uses syn 2 while the rest of the macro graph uses syn 3" },
]
# The fuzz harness follows the local Rivet source across release versions.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
