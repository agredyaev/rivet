[package]
name = "rivet"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-std = "=4.0.3"
libc = "=0.2.176"
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "=1.0.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.47.1", features = ["rt", "macros", "io-std", "io-util", "process", "sync", "time"] }
toml = "=0.9.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
