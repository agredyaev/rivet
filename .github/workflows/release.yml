name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and update
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rivet
            asset: rivet-linux-x64.zip
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: rivet
            asset: rivet-linux-aarch64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: rivet
            asset: rivet-darwin-arm64.zip
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            binary: rivet.exe
            asset: rivet-windows-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: python3 -m pip install cargo-zigbuild==0.23.4
      - if: runner.os == 'Linux'
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package one-step installer
        run: |
          set -euo pipefail
          package_dir=dist/package
          mkdir -p "$package_dir/bin"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$package_dir/bin/${{ matrix.binary }}"
          cp rivet.example.toml "$package_dir/rivet.toml"
          chmod +x "$package_dir/bin/${{ matrix.binary }}"
          (cd "$package_dir" && zip -qr "../${{ matrix.asset }}" .)
          entries=$(unzip -Z1 "dist/${{ matrix.asset }}")
          printf '%s\n' "$entries" | grep -Fxq 'rivet.toml'
          ! printf '%s\n' "$entries" | grep -Eq '(^|/)(scripts/|install\.sh$|install\.ps1$)'
          printf '%s\n' "$entries" | grep -Fxq 'bin/${{ matrix.binary }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Replace binaries and checksum on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          (cd dist && sha256sum rivet-* > SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber
