name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag whose tested CI artifacts should be published
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose tested CI artifacts should be published
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve tested CI run for release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          ref_json="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")"
          sha="$(jq -r '.object.sha' <<< "$ref_json")"
          type="$(jq -r '.object.type' <<< "$ref_json")"
          if [[ "$type" == "tag" ]]; then
            tag_json="$(gh api "repos/$GH_REPO/git/tags/$sha")"
            sha="$(jq -r '.object.sha' <<< "$tag_json")"
          fi

          runs="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=20")"
          run_id="$(jq -r '
            .workflow_runs
            | map(select(.status == "completed" and .conclusion == "success"))
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ' <<< "$runs")"

          if [[ -z "$run_id" ]]; then
            echo "::error::No successful post-merge CI run found for release commit $sha."
            exit 1
          fi

          artifact="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "rivet-release-assets" and .expired == false) | .id' | head -n1)"
          if [[ -z "$artifact" ]]; then
            echo "::error::CI run $run_id has no rivet-release-assets artifact."
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using post-merge CI run $run_id for release commit $sha"

      - name: Download tested release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GH_REPO" --name rivet-release-assets --dir dist

      - name: Verify and publish existing CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          expected=(
            rivet-linux-x64.zip
            rivet-linux-aarch64.zip
            rivet-darwin-arm64.zip
            rivet-windows-x64.zip
            SHA256SUMS
          )
          for asset in "${expected[@]}"; do
            test -f "dist/$asset"
          done

          (cd dist && sha256sum -c SHA256SUMS)
          gh release upload "$TAG" dist/rivet-*.zip dist/SHA256SUMS --clobber

          release_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for asset in "${expected[@]}"; do
            grep -Fxq "$asset" <<< "$release_assets"
          done

          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [[ "$latest" != "$TAG" ]]; then
            echo "::error::Published release $TAG is not GitHub releases/latest (got $latest)."
            exit 1
          fi
