name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - if: runner.os != 'Windows'
        run: target/release/rivet config-check --config rivet.example.toml --root .
      - if: runner.os == 'Windows'
        run: target/release/rivet.exe config-check --config rivet.example.toml --root .
      - if: runner.os != 'Windows'
        run: |
          bash -n start-rivet.sh
          bash -n install.sh
          bash -n install-session.sh
          bash -n scripts/start-tunnel.sh
          bash -n scripts/sync-tunnel-client.sh
          bash -n scripts/ui.sh
          bash install.sh --help
      - if: runner.os != 'Windows'
        run: python3 tests/smoke.py target/release/rivet
      - if: runner.os != 'Windows'
        run: bash tests/setup-smoke.sh
      - if: runner.os != 'Windows'
        run: bash tests/install-session-smoke.sh
      - if: runner.os == 'Windows'
        run: python tests/portable_smoke.py target/release/rivet.exe
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @("$env:GITHUB_WORKSPACE/install.ps1", "$env:GITHUB_WORKSPACE/install-session.ps1", "$env:GITHUB_WORKSPACE/start-rivet.ps1", "$env:GITHUB_WORKSPACE/scripts/start-tunnel.ps1", "$env:GITHUB_WORKSPACE/scripts/sync-tunnel-client.ps1", "$env:GITHUB_WORKSPACE/scripts/serve-rivet-mcp.ps1", "$env:GITHUB_WORKSPACE/scripts/ui.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-pc-windows-gnu
      - run: python3 -m pip install cargo-zigbuild==0.23.4
      - run: cargo zigbuild --locked --release --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu --target x86_64-pc-windows-gnu
      - run: python3 tests/smoke.py target/x86_64-unknown-linux-gnu/release/rivet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivet-cross-targets
          path: |
            target/x86_64-unknown-linux-gnu/release/rivet
            target/aarch64-unknown-linux-gnu/release/rivet
            target/x86_64-pc-windows-gnu/release/rivet.exe
          if-no-files-found: error

  verify-cross-windows:
    needs: cross
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rivet-cross-targets
          path: cross
      - run: python tests/portable_smoke.py cross/x86_64-pc-windows-gnu/release/rivet.exe
