name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      release_only: ${{ steps.mode.outputs.release_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 tests/ci_mode.py
      - name: Select full checks or release build
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$(git rev-parse HEAD^1)}"
          python3 scripts/ci_mode.py --base "$base" --repo "$GH_REPO" --event "$EVENT"

  dependencies:
    needs: mode
    if: ${{ needs.mode.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo install cargo-machete --version 0.9.2 --locked
      - run: cargo deny --locked check
      - name: Diagnose fuzz lockfile drift
        run: |
          cargo metadata --manifest-path fuzz/Cargo.toml --format-version 1 >/dev/null
          git diff -- fuzz/Cargo.lock
          test -z "$(git status --short fuzz/Cargo.lock)"
      - run: cargo machete
      - run: python3 tests/dependencies.py

  build:
    needs: mode
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-user --unshare-net --ro-bind / / /usr/bin/true
      - if: needs.mode.outputs.release_only != 'true'
        run: cargo fmt --check
      - if: needs.mode.outputs.release_only != 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: needs.mode.outputs.release_only != 'true'
        run: cargo test --locked
      - run: cargo build --locked --release
      - if: runner.os == 'macOS'
        run: otool -L target/release/rivet
      - if: runner.os == 'Linux'
        run: readelf -d target/release/rivet
      - run: target/release/rivet --help && target/release/rivet session --help
      - run: |
          bash -n scripts/install.sh
          help=$(bash scripts/install.sh --help)
          grep -Fq -- '--pass-env NAME' <<< "$help"
          printf '%s\n' "$help"
      - run: python3 tests/cli_ui.py target/release/rivet
      - run: python3 tests/install_smoke.py
      - run: python3 tests/smoke.py target/release/rivet
      - if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          file target/aarch64-apple-darwin/release/rivet | grep -Eq 'Mach-O 64-bit executable arm64'
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivet-macos-target
          path: target/aarch64-apple-darwin/release/rivet
          if-no-files-found: error

  fuzz:
    needs: mode
    if: ${{ needs.mode.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz critical input boundaries
        run: |
          cargo fuzz run tunnel_wire -- -max_total_time=10 -timeout=2 -dict=fuzz/dictionaries/tunnel_wire.dict
          cargo fuzz run tunnel_wire_structured -- -max_total_time=10 -timeout=2
          cargo fuzz run tunnel_policy -- -max_total_time=10 -timeout=2
          cargo fuzz run mcp_wire -- -max_total_time=10 -timeout=2 -dict=fuzz/dictionaries/mcp_wire.dict
          cargo fuzz run command_policy -- -max_total_time=10 -timeout=2
          cargo fuzz run path_policy -- -max_total_time=10 -timeout=2
          cargo fuzz run output_buffer -- -max_total_time=10 -timeout=2

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - run: python3 -m pip install cargo-zigbuild==0.23.4 ziglang==0.17.0
      - run: |
          export PATH="$(python3 -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent)'):$PATH"
          test "$(zig version)" = "0.17.0"
          cargo zigbuild --locked --release --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu
      - run: |
          file target/x86_64-unknown-linux-gnu/release/rivet | grep -Eq 'ELF 64-bit.*x86-64'
          file target/aarch64-unknown-linux-gnu/release/rivet | grep -Eq 'ELF 64-bit.*ARM aarch64'
      - run: python3 tests/smoke.py target/x86_64-unknown-linux-gnu/release/rivet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivet-cross-targets
          path: |
            target/x86_64-unknown-linux-gnu/release/rivet
            target/aarch64-unknown-linux-gnu/release/rivet
          if-no-files-found: error

  release-artifacts:
    needs: [mode, build, cross, fuzz, dependencies]
    if: >-
      ${{ always() && !cancelled() && needs.mode.result == 'success'
          && needs.build.result == 'success' && needs.cross.result == 'success'
          && ((needs.mode.outputs.release_only == 'true'
               && needs.dependencies.result == 'skipped' && needs.fuzz.result == 'skipped')
              || (needs.mode.outputs.release_only != 'true'
                  && needs.dependencies.result == 'success' && needs.fuzz.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rivet-cross-targets
          path: staged/cross
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rivet-macos-target
          path: staged/macos
      - name: Package tested release assets
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          mkdir -p dist

          package() {
            binary="$1"
            binary_name="$2"
            asset="$3"
            package_dir="$(mktemp -d)"
            mkdir -p "$package_dir/bin"
            cp "$binary" "$package_dir/bin/$binary_name"
            chmod +x "$package_dir/bin/$binary_name"
            cp LICENSE "$package_dir/LICENSE"
            (cd "$package_dir" && zip -qr "$GITHUB_WORKSPACE/dist/$asset" .)
            rm -rf "$package_dir"

            entries="$(unzip -Z1 "dist/$asset")"
            files="$(printf '%s\n' "$entries" | sed '/\/$/d')"
            test "$(printf '%s\n' "$files" | sort)" = "$(printf '%s\n' LICENSE "bin/$binary_name" | sort)"
            ! printf '%s\n' "$entries" | grep -Eq '(^|/)(scripts/|install\.sh$|install\.ps1$)'
          }

          package staged/cross/x86_64-unknown-linux-gnu/release/rivet rivet "rivet-v$version-linux-x64.zip"
          package staged/cross/aarch64-unknown-linux-gnu/release/rivet rivet "rivet-v$version-linux-aarch64.zip"
          package staged/macos/rivet rivet "rivet-v$version-darwin-arm64.zip"

          (cd dist && sha256sum rivet-*.zip > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

          expected="$(printf '%s\n' SHA256SUMS "rivet-v$version-darwin-arm64.zip" "rivet-v$version-linux-aarch64.zip" "rivet-v$version-linux-x64.zip" | sort)"
          actual="$(find dist -maxdepth 1 -type f -exec basename {} \; | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Unexpected release artifact set."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivet-release-assets
          path: |
            dist/rivet-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
