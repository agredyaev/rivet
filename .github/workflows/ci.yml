name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore(main): release ') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - if: runner.os != 'Windows'
        run: target/release/rivet --help && target/release/rivet serve --help
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & target/release/rivet.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/release/rivet.exe serve --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os != 'Windows'
        run: target/release/rivet config-check --config rivet.example.toml --root .
      - if: runner.os == 'Windows'
        run: target/release/rivet.exe config-check --config rivet.example.toml --root .
      - if: runner.os != 'Windows'
        run: |
          bash -n scripts/install.sh
          help=$(bash scripts/install.sh --help)
          grep -Fq -- '--allow-any-args NAME' <<< "$help"
          printf '%s\n' "$help"
      - if: runner.os != 'Windows'
        run: python3 tests/smoke.py target/release/rivet
      - if: runner.os == 'Windows'
        run: python tests/portable_smoke.py target/release/rivet.exe
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @("$env:GITHUB_WORKSPACE/scripts/install.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
          $help = & pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/scripts/install.ps1" -Help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell installer -Help failed.' }
          if ($help -notmatch '-AllowAnyArgs') { throw 'PowerShell installer help omits -AllowAnyArgs.' }
      - if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivet-macos-target
          path: target/aarch64-apple-darwin/release/rivet
          if-no-files-found: error

  cross:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore(main): release ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-pc-windows-gnu
      - run: python3 -m pip install cargo-zigbuild==0.23.4
      - run: cargo zigbuild --locked --release --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu --target x86_64-pc-windows-gnu
      - run: python3 tests/smoke.py target/x86_64-unknown-linux-gnu/release/rivet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivet-cross-targets
          path: |
            target/x86_64-unknown-linux-gnu/release/rivet
            target/aarch64-unknown-linux-gnu/release/rivet
            target/x86_64-pc-windows-gnu/release/rivet.exe
          if-no-files-found: error

  release-merge:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'chore(main): release ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for tested release-PR artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          commit="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA")"
          source_sha="$(jq -r '.parents[1].sha // empty' <<< "$commit")"
          if [[ -z "$source_sha" ]]; then
            echo "::error::Release merge has no second parent."
            exit 1
          fi

          release_tree="$(gh api "repos/$GH_REPO/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          source_tree="$(gh api "repos/$GH_REPO/git/commits/$source_sha" --jq .tree.sha)"
          if [[ "$release_tree" != "$source_tree" ]]; then
            echo "::error::Release PR tree does not match the merged release tree."
            exit 1
          fi

          for _ in $(seq 1 120); do
            runs="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$source_sha&per_page=20")"
            run_id="$(jq -r '
              .workflow_runs
              | map(select(.event == "pull_request"))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' <<< "$runs")"
            status="$(jq -r --argjson id "${run_id:-0}" '
              .workflow_runs
              | map(select(.id == $id))
              | .[0].status // empty
            ' <<< "$runs")"
            conclusion="$(jq -r --argjson id "${run_id:-0}" '
              .workflow_runs
              | map(select(.id == $id))
              | .[0].conclusion // empty
            ' <<< "$runs")"

            if [[ -n "$run_id" && "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "::error::Release PR CI run $run_id completed with $conclusion."
                exit 1
              fi
              artifact="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "rivet-release-assets" and .expired == false) | .id' | head -n1)"
              if [[ -z "$artifact" ]]; then
                echo "::error::Release PR CI run $run_id has no rivet-release-assets artifact."
                exit 1
              fi
              echo "Release PR CI $run_id is green and artifact $artifact is ready."
              exit 0
            fi

            echo "Waiting for release PR CI for $source_sha..."
            sleep 10
          done

          echo "::error::Timed out waiting for release PR CI for $source_sha."
          exit 1

  verify-cross-windows:
    needs: cross
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rivet-cross-targets
          path: cross
      - run: python tests/portable_smoke.py cross/x86_64-pc-windows-gnu/release/rivet.exe

  release-artifacts:
    needs: [build, cross, verify-cross-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rivet-cross-targets
          path: staged/cross
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rivet-macos-target
          path: staged/macos
      - name: Package tested release assets
        run: |
          set -euo pipefail
          mkdir -p dist

          package() {
            binary="$1"
            binary_name="$2"
            asset="$3"
            package_dir="$(mktemp -d)"
            mkdir -p "$package_dir/bin"
            cp "$binary" "$package_dir/bin/$binary_name"
            cp rivet.example.toml "$package_dir/rivet.toml"
            chmod +x "$package_dir/bin/$binary_name"
            (cd "$package_dir" && zip -qr "$GITHUB_WORKSPACE/dist/$asset" .)
            rm -rf "$package_dir"

            entries="$(unzip -Z1 "dist/$asset")"
            printf '%s\n' "$entries" | grep -Fxq 'rivet.toml'
            printf '%s\n' "$entries" | grep -Fxq "bin/$binary_name"
            ! printf '%s\n' "$entries" | grep -Eq '(^|/)(scripts/|install\.sh$|install\.ps1$)'
          }

          package staged/cross/x86_64-unknown-linux-gnu/release/rivet rivet rivet-linux-x64.zip
          package staged/cross/aarch64-unknown-linux-gnu/release/rivet rivet rivet-linux-aarch64.zip
          package staged/cross/x86_64-pc-windows-gnu/release/rivet.exe rivet.exe rivet-windows-x64.zip
          package staged/macos/rivet rivet rivet-darwin-arm64.zip

          (cd dist && sha256sum rivet-*.zip > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivet-release-assets
          path: |
            dist/rivet-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
