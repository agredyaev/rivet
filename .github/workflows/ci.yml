name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-user --unshare-net --ro-bind / / /usr/bin/true
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: target/release/rivet --help && target/release/rivet serve --help
      - run: target/release/rivet config-check --config rivet.example.toml --root .
      - run: |
          bash -n scripts/install.sh
          help=$(bash scripts/install.sh --help)
          grep -Fq -- '--allow-any-args NAME' <<< "$help"
          printf '%s\n' "$help"
      - run: python3 tests/smoke.py target/release/rivet
      - if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          file target/aarch64-apple-darwin/release/rivet | grep -Eq 'Mach-O 64-bit executable arm64'
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivet-macos-target
          path: target/aarch64-apple-darwin/release/rivet
          if-no-files-found: error

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz critical input boundaries
        run: |
          cargo fuzz run tunnel_wire -- -max_total_time=10 -timeout=2 -dict=fuzz/dictionaries/tunnel_wire.dict
          cargo fuzz run tunnel_wire_structured -- -max_total_time=10 -timeout=2
          cargo fuzz run tunnel_policy -- -max_total_time=10 -timeout=2
          cargo fuzz run mcp_wire -- -max_total_time=10 -timeout=2 -dict=fuzz/dictionaries/mcp_wire.dict
          cargo fuzz run command_policy -- -max_total_time=10 -timeout=2
          cargo fuzz run path_policy -- -max_total_time=10 -timeout=2
          cargo fuzz run output_buffer -- -max_total_time=10 -timeout=2

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - run: python3 -m pip install cargo-zigbuild==0.23.4
      - run: cargo zigbuild --locked --release --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu
      - run: |
          file target/x86_64-unknown-linux-gnu/release/rivet | grep -Eq 'ELF 64-bit.*x86-64'
          file target/aarch64-unknown-linux-gnu/release/rivet | grep -Eq 'ELF 64-bit.*ARM aarch64'
      - run: python3 tests/smoke.py target/x86_64-unknown-linux-gnu/release/rivet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivet-cross-targets
          path: |
            target/x86_64-unknown-linux-gnu/release/rivet
            target/aarch64-unknown-linux-gnu/release/rivet
          if-no-files-found: error

  release-artifacts:
    needs: [build, cross, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rivet-cross-targets
          path: staged/cross
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rivet-macos-target
          path: staged/macos
      - name: Package tested release assets
        run: |
          set -euo pipefail
          mkdir -p dist

          package() {
            binary="$1"
            binary_name="$2"
            asset="$3"
            package_dir="$(mktemp -d)"
            mkdir -p "$package_dir/bin"
            cp "$binary" "$package_dir/bin/$binary_name"
            chmod +x "$package_dir/bin/$binary_name"
            (cd "$package_dir" && zip -qr "$GITHUB_WORKSPACE/dist/$asset" .)
            rm -rf "$package_dir"

            entries="$(unzip -Z1 "dist/$asset")"
            printf '%s\n' "$entries" | grep -Fxq "bin/$binary_name"
            ! printf '%s\n' "$entries" | grep -Eq '(^|/)(scripts/|install\.sh$|install\.ps1$)'
          }

          package staged/cross/x86_64-unknown-linux-gnu/release/rivet rivet rivet-linux-x64.zip
          package staged/cross/aarch64-unknown-linux-gnu/release/rivet rivet rivet-linux-aarch64.zip
          package staged/macos/rivet rivet rivet-darwin-arm64.zip

          (cd dist && sha256sum rivet-*.zip > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

          expected="$(printf '%s\n' SHA256SUMS rivet-darwin-arm64.zip rivet-linux-aarch64.zip rivet-linux-x64.zip | sort)"
          actual="$(find dist -maxdepth 1 -type f -exec basename {} \; | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Unexpected release artifact set."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivet-release-assets
          path: |
            dist/rivet-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
